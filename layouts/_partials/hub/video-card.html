<article class="hub-video-card">
  <div class="hub-video-thumb" style="background-image: linear-gradient(135deg, rgba(7,14,24,.2), rgba(7,14,24,.85)), url('{{ .image | relURL }}');"><span class="play-mark">▶</span></div>
  <div class="hub-video-body"><p class="module-code">{{ .type }} / {{ .duration }}</p><h2>{{ .title }}</h2><p>{{ .description }}</p></div>
</article>
